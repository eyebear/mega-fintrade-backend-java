services:
  postgres:
    image: postgres:17
    container_name: mega-fintrade-postgres
    environment:
      POSTGRES_DB: portfolio_db
      POSTGRES_USER: portfolio_user
      POSTGRES_PASSWORD: portfolio_password
    ports:
      - "5433:5432"
    volumes:
      - mega_fintrade_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio_user -d portfolio_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mega-fintrade-backend-java
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/portfolio_db
      SPRING_DATASOURCE_USERNAME: portfolio_user
      SPRING_DATASOURCE_PASSWORD: portfolio_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APP_SCHEDULING_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data

volumes:
  mega_fintrade_postgres_data: